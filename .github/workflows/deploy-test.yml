name: Deploy TEST

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: snowflake-deploy-test
  cancel-in-progress: false

jobs:

  terraform-apply:
    runs-on: ubuntu-latest
    
    environment:
      name: TEST

    env:
      SNOWFLAKE_USER: GITHUB_TEST_TERRAFORM_SVC
      SNOWFLAKE_WORKLOAD_IDENTITY_PROVIDER: OIDC

    steps:
      - uses: actions/checkout@v4

      - uses: snowflakedb/snowflake-actions@v3
        with:
          use-oidc: true

      - name: Verify Snowflake Terraform Identity
        run: snow sql -q "select CURRENT_USER(), CURRENT_ROLE(), CURRENT_ACCOUNT()" -x

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false

      - name: Terraform Init
        run: |
          cd terraform
          terraform init -input=false

      - name: Import Existing Foundation Role
        run: |
          cd terraform
          if terraform state show snowflake_account_role.tf_platform_role > /dev/null 2>&1; then
            echo "Foundation role is already in Terraform state"
          else
            terraform import -input=false \
              -var-file=environments/test.tfvars \
              snowflake_account_role.tf_platform_role TF_PLATFORM_ROLE_V1
          fi
      
      - name: Terraform Plan Foundation Layer
        run: |
          cd terraform
          terraform plan -input=false -no-color -out=tfplan -var-file=environments/test.tfvars

      - name: Terraform Apply Reviewed Plan
        run: |
          cd terraform
          terraform apply -input=false tfplan
      - name: Show Snowflake Environment
        run: |
          env | grep SNOWFLAKE

  dcm-deploy:
    runs-on: ubuntu-latest
    needs: terraform-apply

    environment:
      name: TEST

    env:
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: GITHUB_TEST_DCM_SVC
      SNOWFLAKE_WORKLOAD_IDENTITY_PROVIDER: OIDC

    steps:
      - uses: actions/checkout@v4

      - uses: snowflakedb/snowflake-actions@v3
        with:
          use-oidc: true

      - name: Verify Snowflake DCM Identity
        run: snow sql -q "select CURRENT_USER(), CURRENT_ROLE(), CURRENT_ACCOUNT()" -x

      - name: DCM Deploy Object Layer
        run: |
          snow dcm deploy --target TEST -x