name: Deploy TEST

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:

  terraform-apply:
    runs-on: ubuntu-latest
    
    environment:
           name: TEST

    env:
      SNOWFLAKE_USER: GITHUB_TEST_SVC
      SNOWFLAKE_WORKLOAD_IDENTITY_PROVIDER: OIDC

    steps:
      - uses: actions/checkout@v4

      - uses: snowflakedb/snowflake-actions@v3
        with:
          use-oidc: true

      - uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: |
          cd terraform
          terraform init
      
      - name: Terraform Apply Foundation Layer
        run: |
          cd terraform
          terraform apply -auto-approve
      - name: Show Snowflake Environment
        run: |
          env | grep SNOWFLAKE

  dcm-deploy:
    runs-on: ubuntu-latest
    needs: terraform-apply

    env:
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: GITHUB_TEST_SVC

    steps:
      - uses: actions/checkout@v4

      - uses: snowflakedb/snowflake-actions@v3
        with:
          use-oidc: true

      - name: DCM Deploy Object Layer
        run: |
          snow dcm deploy --target TEST -x